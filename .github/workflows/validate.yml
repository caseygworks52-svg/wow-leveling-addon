name: Validate LevelGuide

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lua51-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Verify manifests and data
        run: python3 Tools/verify_all.py
      - name: Run server-sync regression tests
        run: lua5.1 Tools/test_sync.lua
      - name: Compile every Lua file
        run: |
          find LevelGuide LevelGuide_Data_Alliance LevelGuide_Data_Horde -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
