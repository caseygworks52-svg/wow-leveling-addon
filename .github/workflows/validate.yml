name: Validate LevelGuide
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Verify addon files and Lua syntax
        run: python3 Tools/verify_all.py
      - name: Run regression contract tests
        run: python3 Tools/test_contract.py
